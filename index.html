<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Perekup Radar</title>
  <!-- Скрипт Telegram: тема, кнопки внизу экрана, sendData. Без Telegram — демо-режим. -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="banner" class="banner" hidden></div>
  <main id="app" aria-live="polite">
    <p class="loading">…</p>
  </main>
  <!-- Кнопка «Сохранить» вне Telegram (в Telegram — его собственная кнопка внизу) -->
  <div id="bottom" class="bottom" hidden>
    <button id="bottom-button" class="button primary" type="button"></button>
  </div>
  <dialog id="demo-dialog" class="dialog">
    <p id="demo-title"></p>
    <pre id="demo-out"></pre>
    <form method="dialog"><button class="button" id="demo-close"></button></form>
  </dialog>
  <script src="app.js"></script>
</body>
</html>
